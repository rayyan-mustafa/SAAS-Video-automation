name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Code Quality & Master Module Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Static Type Check (tsc)
        run: npm run typecheck

      - name: ESLint Code Quality
        run: npm run lint

      - name: Master Module Regression & Security Test Suite
        run: npm run test:unit
        env:
          ADMIN_SECRET: ci-test-admin-secret-at-least-32-chars-long
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
          ENCRYPTION_KEY: ci-test-encryption-key-32-chars-long
          ADMIN_USER: autora_admin
          ADMIN_PASSWORD: TestAdminPassword123!
          AUTH_SECRET: ci-test-auth-secret-at-least-32-chars-long
          NEXT_TELEMETRY_DISABLED: 1

      - name: Next.js Production Build Validation
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          ADMIN_SECRET: ci-test-admin-secret-at-least-32-chars-long
          JWT_SECRET: ci-test-jwt-secret-at-least-32-chars-long
          ENCRYPTION_KEY: ci-test-encryption-key-32-chars-long
          AUTH_SECRET: ci-test-auth-secret-at-least-32-chars-long
